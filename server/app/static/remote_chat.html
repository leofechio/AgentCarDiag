<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Antigravity Remote — AgentCarDiag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-surface: #101623;
      --bg-card: #161e31;
      --border-subtle: #243049;
      --accent-cyan: #00d2ff;
      --accent-blue: #3a86ff;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: rgba(16, 22, 35, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }
    .brand-title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
    }
    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-icon:active {
      transform: scale(0.95);
    }

    #chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-wrapper.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg-wrapper.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .bubble {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg-wrapper.user .bubble {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #fff;
      border-bottom-right-radius: 3px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .msg-wrapper.assistant .bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      border-bottom-left-radius: 3px;
    }

    .bubble pre {
      background: #060911;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      margin: 8px 0;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .bubble code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.3);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .bubble img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
      border: 1px solid var(--border-subtle);
    }

    /* Footer & Input */
    footer {
      background: rgba(16, 22, 35, 0.95);
      border-top: 1px solid var(--border-subtle);
      padding: 10px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preview-container {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--accent-cyan);
      overflow-x: auto;
      max-width: 100%;
      scrollbar-width: thin;
    }
    .preview-item {
      position: relative;
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }
    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-item-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 10px;
      line-height: 16px;
      text-align: center;
      cursor: pointer;
    }
    .preview-count {
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 600;
      white-space: nowrap;
      margin-left: 4px;
    }

    .msg-images-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .msg-images-grid img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      object-fit: contain;
      cursor: pointer;
    }

    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .input-box {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-main);
      padding: 10px 14px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 110px;
      min-height: 42px;
      line-height: 1.4;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus {
      border-color: var(--accent-cyan);
    }
    .btn-send {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #000;
      border: none;
      font-weight: 700;
      border-radius: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .btn-send:active {
      transform: scale(0.92);
    }
    .btn-attach {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 18px;
    }
    .btn-attach:active {
      color: var(--accent-cyan);
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 8px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      gap: 4px;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--accent-cyan);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-title">Antigravity Remote</div>
        <div class="brand-subtitle"><span class="status-dot"></span> Online &bull; Servidor Ativo</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="fetchTranscript()" title="Atualizar histórico">🔄</button>
      <a href="/" class="btn-icon" title="Voltar ao Dashboard" style="text-decoration:none;">🚗</a>
    </div>
  </header>

  <main id="chat-stream"></main>

  <div class="typing-indicator" id="typing">
    <span></span><span></span><span></span>
  </div>

  <footer>
    <div class="preview-container" id="preview-box">
      <div id="preview-list" style="display:flex; gap:8px; align-items:center;"></div>
      <div class="preview-count" id="preview-count"></div>
    </div>

    <div class="input-bar">
      <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="handleFileSelect(event)">
      <button class="btn-attach" onclick="document.getElementById('file-input').click()" title="Anexar prints / fotos">📎</button>
      <textarea id="msg-input" class="input-box" rows="1" placeholder="Mensagem para o assistente..." oninput="autoGrow(this)" onkeydown="checkEnter(event)"></textarea>
      <button class="btn-send" id="btn-send" onclick="sendMessage()" title="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </footer>

  <script>
    let activeAttachments = []; // Array de { url, name }
    let isSending = false;

    function renderMarkdown(md) {
      if (!md) return '';
      return md
        .replace(/```([a-z]*)([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
    }

    function appendMessage(role, text, imageUrl = null, imageUrls = []) {
      const container = document.getElementById('chat-stream');
      const wrap = document.createElement('div');
      wrap.className = `msg-wrapper ${role}`;

      const sender = document.createElement('div');
      sender.className = 'msg-sender';
      sender.textContent = role === 'user' ? 'Você (Celular)' : 'Antigravity AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = renderMarkdown(text);

      const allImgs = [];
      if (imageUrls && imageUrls.length > 0) allImgs.push(...imageUrls);
      else if (imageUrl) allImgs.push(imageUrl);

      if (allImgs.length > 0) {
        const grid = document.createElement('div');
        grid.className = 'msg-images-grid';
        allImgs.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.loading = 'lazy';
          img.onclick = () => window.open(src, '_blank');
          grid.appendChild(img);
        });
        bubble.appendChild(grid);
      }

      wrap.appendChild(sender);
      wrap.appendChild(bubble);
      container.appendChild(wrap);
      container.scrollTop = container.scrollHeight;
    }

    async function fetchTranscript() {
      try {
        const res = await fetch('/api/remote/transcript');
        if (!res.ok) return;
        const data = await res.json();
        const container = document.getElementById('chat-stream');
        container.innerHTML = '';
        if (data.messages && data.messages.length > 0) {
          data.messages.forEach(m => appendMessage(m.role, m.content, m.image, m.images || []));
        } else {
          appendMessage('assistant', '👋 Olá Leonardo! O portal remoto do Antigravity está conectado. Você pode enviar perguntas, comandar o servidor ou anexar vários prints e fotos simultaneamente.');
        }
      } catch (err) {
        console.error('Erro ao carregar transcript:', err);
      }
    }

    async function handleFileSelect(evt) {
      const files = Array.from(evt.target.files || []);
      if (files.length === 0) return;

      const fd = new FormData();
      files.forEach(f => fd.append('files', f));

      try {
        // Envia múltiplos arquivos para o endpoint de upload em lote
        const res = await fetch('/api/remote/upload-multi', { method: 'POST', body: fd });
        if (!res.ok) throw new Error('Falha no upload das imagens');
        const json = await res.json();

        if (json.files && json.files.length > 0) {
          json.files.forEach(f => {
            activeAttachments.push({ url: f.url, name: f.original_name });
          });
          renderPreviewList();
        }
      } catch (e) {
        // Fallback para upload unitário se necessário
        for (let file of files) {
          try {
            const singleFd = new FormData();
            singleFd.append('file', file);
            const r = await fetch('/api/remote/upload', { method: 'POST', body: singleFd });
            const j = await r.json();
            if (j.url) activeAttachments.push({ url: j.url, name: file.name });
          } catch (err) {
            console.error('Erro upload unitário:', err);
          }
        }
        renderPreviewList();
      }
      document.getElementById('file-input').value = '';
    }

    function renderPreviewList() {
      const box = document.getElementById('preview-box');
      const list = document.getElementById('preview-list');
      const count = document.getElementById('preview-count');
      list.innerHTML = '';

      if (activeAttachments.length === 0) {
        box.style.display = 'none';
        return;
      }

      box.style.display = 'flex';
      count.textContent = `${activeAttachments.length} print(s)`;

      activeAttachments.forEach((att, idx) => {
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `
          <img src="${att.url}" alt="Thumb">
          <button class="preview-item-remove" onclick="removeAttachment(${idx})">✕</button>
        `;
        list.appendChild(item);
      });
    }

    function removeAttachment(index) {
      activeAttachments.splice(index, 1);
      renderPreviewList();
    }

    function clearAttachments() {
      activeAttachments = [];
      renderPreviewList();
    }

    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 110) + 'px';
    }

    function checkEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      if (isSending) return;
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      const images = activeAttachments.map(a => a.url);

      if (!text && images.length === 0) return;

      isSending = true;
      input.value = '';
      input.style.height = '42px';

      appendMessage('user', text, null, images);
      clearAttachments();

      const typing = document.getElementById('typing');
      typing.style.display = 'flex';
      const container = document.getElementById('chat-stream');
      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch('/api/remote/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: text, 
            image_urls: images,
            image_url: images[0] || null 
          })
        });
        const data = await res.json();
        typing.style.display = 'none';

        if (data.reply) {
          appendMessage('assistant', data.reply);
        } else {
          appendMessage('assistant', '⚠️ Não foi possível obter resposta do assistente.');
        }
      } catch (e) {
        typing.style.display = 'none';
        appendMessage('assistant', '❌ Erro de conexão com o servidor: ' + e.message);
      } finally {
        isSending = false;
      }
    }

    // Suporte a colar prints diretamente da área de transferência (Ctrl+V ou Colar no Celular)
    window.addEventListener('paste', async (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      const files = [];
      for (let item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          files.push(item.getAsFile());
        }
      }
      if (files.length > 0) {
        handleFileSelect({ target: { files } });
      }
    });

    // Carrega o histórico assim que abre no celular
    document.addEventListener('DOMContentLoaded', fetchTranscript);
  </script>
</body>
</html>
